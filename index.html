<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Culture Archive</title>
  <link rel="stylesheet" href="style.css">
</head>

  
<body>

  <header>
    <h1>Culture Archive</h1>
    <p>A personal archive of media, writing, and collected works.</p>
  </header>

  <main>

    <h2>Library</h2>

    <section>
      <button>Images</button>
      <button>Audio</button>
      <button>Video</button>
      <button>Writing</button>
      <button>Poetry</button>
      <button>Lyrics</button>
      <button>PDF Books</button>
    </section>

<div id="library-items"></div>
    
    <button id="show-form-button">Add New Item</button>

<section id="upload-form" style="display: none;">
  <h2>Add New Item</h2>

  <label for="item-title">Title</label>
  <input type="text" id="item-title">

  <label for="item-type">Type</label>
  <select id="item-type">
    <option value="image">Image</option>
    <option value="audio">Audio</option>
    <option value="video">Video</option>
    <option value="writing">Writing</option>
    <option value="poetry">Poetry</option>
    <option value="lyrics">Lyrics</option>
    <option value="pdf">PDF Book</option>
  </select>

  <label for="item-description">Description</label>
  <textarea id="item-description"></textarea>

  <label for="item-file">Choose File</label>
  <input type="file" id="item-file">

  <button id="save-item-button">Add to Archive</button>
</section>

  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
  
</body>

</html>
